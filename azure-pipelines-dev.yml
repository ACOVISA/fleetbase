trigger:
  branches:
    include:
    - main
  paths:
    include:
    - console/*
    - aks-dev/*
    - azure-pipelines-dev.yml

pr:
  branches:
    exclude:
    - '*'

resources:
- repo: self

variables:
- group: 'fleetbase-dev-secrets' # must contain: fleetbaseMysqlRootPassword, fleetbaseMysqlPassword, fleetbaseAppKey
- name: branch
  value: 'dev'
- name: dockerRegistryServiceConnection
  value: '6168c416-769e-4899-9f9b-571148ca4c03' # same ACR service connection used by the other inovaco pipelines
- name: imageRepository
  value: 'fleetbase-console-$(branch)'
- name: containerRegistry
  value: 'acovisadocker.azurecr.io'
- name: dockerfilePath
  value: 'console/Dockerfile'
- name: buildContext
  value: 'console'
- name: tag
  value: '$(Build.BuildId)'
- name: imagePullSecret
  value: 'acovisadockereaaa-auth'
- name: aksGroup
  value: 'fleetbase'
- name: aksAmbient
  value: 'aks-inovaco-$(branch).$(aksGroup)' # Azure DevOps Environment + Kubernetes resource, scoped to the "fleetbase" namespace — create once via Environments > New environment > Kubernetes resource
- name: vmImageName
  value: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build console image
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push console image to ACR
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        buildContext: $(buildContext)
        containerRegistry: $(dockerRegistryServiceConnection)
        arguments: >
          --build-arg ENVIRONMENT=production
          --build-arg API_HOST=https://fleetbase-api-dev.acovisa.com.br
          --build-arg API_SECURE=true
          --build-arg SOCKETCLUSTER_HOST=fleetbase-socket-dev.acovisa.com.br
          --build-arg SOCKETCLUSTER_PORT=443
          --build-arg SOCKETCLUSTER_SECURE=true
        tags: |
          $(tag)
          latest

    - task: ArchiveFiles@2
      displayName: 'Archive manifests'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/aks-$(branch)'
        includeRootFolder: false
        archiveFile: '$(Build.ArtifactStagingDirectory)/*.yml'

    - task: PublishBuildArtifacts@1
      displayName: Publish Kubernetes manifests
      condition: succeededOrFailed()
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/aks-$(branch)'
        ArtifactName: 'aks-$(branch)'
        publishLocation: 'Container'

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build

  jobs:
  - deployment: Deploy
    displayName: Deploy to fleetbase namespace
    pool:
      vmImage: $(vmImageName)
    environment: $(aksAmbient)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: qetza.replacetokens.replacetokens-task.replacetokens@3
            displayName: 'Replace tokens in **/*.yaml (image tag + secrets from variable group)'
            inputs:
              rootDirectory: '$(Pipeline.Workspace)/aks-$(branch)'
              targetFiles: '**/*.yaml'
              encoding: 'auto'
              tokenPrefix: '#{'
              tokenSuffix: '}#'

          - task: KubernetesManifest@0
            displayName: Create imagePullSecret
            inputs:
              action: createSecret
              namespace: fleetbase
              secretName: $(imagePullSecret)
              dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

          - task: KubernetesManifest@0
            displayName: Deploy manifests
            inputs:
              action: deploy
              namespace: fleetbase
              manifests: '$(Pipeline.Workspace)/aks-$(branch)/*.yaml'
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)
