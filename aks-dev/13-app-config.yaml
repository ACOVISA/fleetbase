apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetbase-app-config
  namespace: fleetbase
data:
  ENVIRONMENT: "production"
  APP_NAME: "Fleetbase"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://fleetbase-api-dev.acovisa.com.br"
  CONSOLE_HOST: "https://fleetbase-dev.acovisa.com.br"
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "info"
  DB_CONNECTION: "mysql"
  DB_HOST: "fleetbase-mysql"
  DB_PORT: "3306"
  DB_DATABASE: "fleetbase"
  DB_USERNAME: "fleetbase"
  DATABASE_URL: "mysql://fleetbase@fleetbase-mysql/fleetbase"
  CACHE_DRIVER: "redis"
  CACHE_PATH: "/fleetbase/api/storage/framework/cache"
  CACHE_URL: "tcp://fleetbase-redis"
  QUEUE_CONNECTION: "redis"
  SESSION_DRIVER: "redis"
  SESSION_DOMAIN: ".acovisa.com.br"
  SESSION_LIFETIME: "120"
  REDIS_HOST: "fleetbase-redis"
  REDIS_PORT: "6379"
  REDIS_URL: "tcp://fleetbase-redis"
  BROADCAST_DRIVER: "socketcluster"
  SOCKETCLUSTER_HOST: "fleetbase-socket"
  SOCKETCLUSTER_PORT: "8000"
  MAIL_MAILER: "log"
  MAIL_FROM_NAME: "Fleetbase"
  REGISTRY_HOST: "https://registry.fleetbase.io"
  REGISTRY_PREINSTALLED_EXTENSIONS: "true"
  OSRM_HOST: "https://router.project-osrm.org"
